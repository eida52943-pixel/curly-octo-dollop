<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WhatsApp Web Clone - A modern, accessible messaging web application with clean architecture">
    <title>WhatsApp Web Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app"></div>

    <!-- Load modules -->
    <script type="module">
        import { App } from './js/ui/App.js';
        import { MockChatService } from './js/services/mockChatService.js';

        // Initialize the application
        const chatService = new MockChatService();
        const app = new App({ chatService });
        app.mount(document.getElementById('app'));

        // Make globally accessible for debugging
        window.app = app;
        window.chatService = chatService;
    </script>
</body>
</html>
